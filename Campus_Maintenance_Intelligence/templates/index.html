<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Maintenance Intelligence</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><h1>Campus Maintenance Intelligence</h1><p>Report issues, track repairs, and explore recurring faults.</p></header><section class="grid"><div class="card"><h2>Report an issue</h2><form id="issueForm"><label>Title<input name="title" minlength="5" maxlength="120" required placeholder="Projector not working"></label><label>Location<input name="location" maxlength="120" required placeholder="Block A, Lab 2"></label><label>Description<textarea name="description" minlength="10" maxlength="1000" required placeholder="Describe the issue..."></textarea></label><button type="submit">Submit issue</button></form><p id="message" role="status"></p></div><div class="card"><h2>Overview</h2><div id="stats" class="stats"></div><h3>Categories</h3><div id="categories"></div><h3>Most reported locations</h3><div id="locations"></div></div></section><section class="card"><h2>Reported issues</h2><div id="issues"></div></section></main><script src="/static/app.js"></script></body></html>
